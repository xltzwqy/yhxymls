<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#181420">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/app-icon.svg">
  <title>个人面板</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    :root { --bg:#100e15; --panel:#191621; --panel-deep:#121019; --line:#3d354c; --line-lit:#68568a; --ink:#f0ebf7; --muted:#a99fb8; --violet:#b99be8; --violet-deep:#705aa1; --glow:#d0b6ff; --danger:#e18c9a; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; color:var(--ink); font-family:"Noto Serif SC",serif; background-color:var(--bg); background-image:linear-gradient(rgba(185,155,232,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(185,155,232,.045) 1px,transparent 1px); background-size:32px 32px; }
    button,input { font:inherit; color:inherit; } button { cursor:pointer; }
    .app { max-width:1520px; margin:0 auto; padding:30px clamp(16px,3.8vw,56px) 56px; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:18px; margin-bottom:24px; padding-bottom:17px; border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:12px; }.brand-mark { color:var(--violet); display:grid; place-items:center; width:36px; height:36px; }.brand h1 { margin:0; font-size:20px; font-weight:700; letter-spacing:2px; }.brand small { display:block; margin-top:2px; color:var(--muted); font:10px "Space Mono",monospace; letter-spacing:1.6px; }
    .actions { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:7px; }.tool { min-width:36px; height:36px; border:1px solid var(--line); background:#1b1822; display:grid; place-items:center; transition:.16s; }.tool:hover { border-color:var(--violet); background:#2a2336; color:var(--glow); }.tool-label { display:flex; width:auto; padding:0 10px; gap:6px; font-size:12px; }
    .workspace { display:flex; align-items:flex-start; gap:25px; }.portrait-column { position:relative; width:37%; min-width:276px; max-width:52%; height:680px; flex:0 0 auto; padding:14px; border:1px solid var(--line-lit); background:var(--panel-deep); box-shadow:0 0 0 5px rgba(185,155,232,.035),12px 12px 0 rgba(0,0,0,.19); }
    .portrait-column::before,.portrait-column::after { content:""; position:absolute; width:25px; height:25px; border-color:var(--violet); pointer-events:none; }.portrait-column::before { left:-1px; top:-1px; border-left:2px solid;border-top:2px solid; }.portrait-column::after { right:-1px; bottom:-1px; border-right:2px solid;border-bottom:2px solid; }
    .portrait-zone { position:relative; width:100%; height:100%; overflow:hidden; background:#17131d; border:1px solid #2d2637; }.portrait-zone::after { content:""; position:absolute; inset:0; pointer-events:none; background:linear-gradient(180deg,transparent 58%,rgba(13,10,18,.68)); }.portrait { width:100%; height:100%; object-fit:cover; display:block; filter:saturate(.78) contrast(1.08); }.portrait[src=""] { display:none; }.portrait-hint { position:absolute; inset:0; z-index:1; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:10px; color:var(--muted); text-align:center; font-size:13px; }.portrait-hint i { color:var(--violet); width:30px; height:30px; }.has-image .portrait-hint { display:none; }.portrait-zone.dragging { outline:2px solid var(--violet); outline-offset:-8px; }.portrait-edit { position:absolute; top:12px; right:12px; z-index:3; width:34px; height:34px; border:1px solid var(--line-lit); background:#17131ddd; display:grid; place-items:center; }.portrait-edit:hover { color:var(--glow); border-color:var(--violet); }
    .resize-handle { position:absolute; z-index:4; touch-action:none; }.resize-handle[data-edge="n"],.resize-handle[data-edge="s"] { left:12px; right:12px; height:14px; cursor:ns-resize; }.resize-handle[data-edge="n"] { top:-7px; }.resize-handle[data-edge="s"] { bottom:-7px; }.resize-handle[data-edge="e"],.resize-handle[data-edge="w"] { top:12px; bottom:12px; width:14px; cursor:ew-resize; }.resize-handle[data-edge="e"] { right:-7px; }.resize-handle[data-edge="w"] { left:-7px; }.resize-handle[data-edge="ne"],.resize-handle[data-edge="nw"],.resize-handle[data-edge="se"],.resize-handle[data-edge="sw"] { width:15px; height:15px; }.resize-handle[data-edge="ne"] { right:-7px;top:-7px;cursor:nesw-resize; }.resize-handle[data-edge="nw"] { left:-7px;top:-7px;cursor:nwse-resize; }.resize-handle[data-edge="se"] { right:-7px;bottom:-7px;cursor:nwse-resize; }.resize-handle[data-edge="sw"] { left:-7px;bottom:-7px;cursor:nesw-resize; }
    .archive { flex:1; min-width:0; }.archive-head { min-height:50px; display:flex; align-items:flex-start; justify-content:flex-end; margin-bottom:16px; }.add-category { height:34px; display:flex; align-items:center; gap:6px; padding:0 11px; border:1px solid var(--violet-deep); background:transparent; color:var(--glow); font-size:12px; }.add-category:hover { background:#2c2439; }
    .categories { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }.category { min-height:163px; border:1px solid var(--line); background:rgba(25,22,33,.94); }.category:first-child { grid-column:span 2; }.category-top { height:47px; display:flex; align-items:center; justify-content:space-between; padding:0 11px 0 15px; border-bottom:1px solid var(--line); background:#211c2a; }.category-title { display:flex; align-items:center; gap:9px; color:var(--ink); font-size:16px; font-weight:700; letter-spacing:1px; }.category-title i { width:17px; color:var(--violet); }.category-controls { display:flex; gap:2px; }.mini { width:28px; height:28px; display:grid; place-items:center; border:0; background:transparent; color:#958ba2; }.mini:hover { background:#322a40; color:var(--glow); }.mini.delete:hover { color:var(--danger); }
    .entries { padding:9px 15px 13px; }.entry { min-height:31px; display:grid; grid-template-columns:110px minmax(0,1fr) 22px; align-items:center; gap:8px; border-bottom:1px dashed #3b3346; }.entry.no-key { grid-template-columns:minmax(0,1fr) 22px; }.entry:last-of-type { border-bottom:0; }.entry-key-wrap { display:flex; align-items:center; min-width:0; gap:3px; }.entry-key { color:var(--muted); font-size:12px; min-width:0; flex:1; }.clear-key { width:20px; height:20px; display:grid; place-items:center; padding:0; border:0; background:transparent; color:#8d829b; }.clear-key:hover { color:var(--danger); }.entry-value { font-size:13px; line-height:1.4; }.entry-remove { color:#8d829b; border:0; background:transparent; padding:3px; }.entry-remove:hover { color:var(--danger)!important; }.add-entry { display:flex; align-items:center; gap:5px; margin-top:7px; padding:4px 0; color:var(--violet); border:0; background:transparent; font-size:12px; }.add-entry:hover { color:var(--glow); text-decoration:underline; }
    .editable { outline:none; border:1px solid transparent; min-width:14px; cursor:text; }.editable:hover { border-bottom-color:#76678b; }.editable:focus { border-color:var(--violet); padding:1px 4px; background:#100d17; }[contenteditable=true]:empty::before { content:attr(data-placeholder); color:#6f6679; }
    .compact { min-height:0; }.compact .entries { display:none; } dialog { width:min(420px,calc(100% - 32px)); padding:0; border:1px solid var(--violet-deep); background:#1b1722; color:var(--ink); box-shadow:12px 12px 0 rgba(0,0,0,.3); } dialog::backdrop { background:rgba(3,2,7,.7); }.dialog-body { padding:22px; }.dialog-body h2 { margin:0 0 18px; font-size:18px; }.dialog-body label { display:block; margin-bottom:6px; color:var(--muted); font-size:12px; }.dialog-body input { width:100%; margin-bottom:18px; padding:9px 10px; border:1px solid var(--line-lit); background:#100d17; }.dialog-actions { display:flex; justify-content:flex-end; gap:8px; }.text-btn { border:1px solid var(--line-lit); background:transparent; padding:8px 12px; }.text-btn.primary { background:#5e4a88; border-color:#8c70ba; }
    body.exporting .actions,body.exporting .add-category,body.exporting .category-controls,body.exporting .add-entry,body.exporting .entry-remove,body.exporting .portrait-edit,body.exporting .resize-handle { visibility:hidden!important; } body.exporting .editable { border-color:transparent!important; }
    @media (max-width:820px) { .app { padding:18px 14px 36px; }.workspace { display:block; }.portrait-column { width:100%; max-width:430px; height:clamp(410px,112vw,530px); margin:0 auto 24px; }.categories { grid-template-columns:1fr; }.category:first-child { grid-column:auto; }.topbar { align-items:flex-start; }.actions { gap:5px; }.tool-label span { display:none; }.tool-label { width:36px; padding:0; }.entry { grid-template-columns:92px minmax(0,1fr) 22px; } }
    @media (max-width:430px) { .topbar { gap:10px; }.brand h1 { font-size:17px; }.brand small { font-size:9px; }.brand-mark { width:30px; }.actions { width:138px; display:grid; grid-template-columns:repeat(3,36px); justify-content:end; }.portrait-column { min-width:0; height:440px; padding:10px; }.archive-head { min-height:38px; margin-bottom:10px; }.add-category { height:32px; }.category-top { height:44px; padding-left:12px; }.category-title { font-size:15px; }.entries { padding:8px 12px 11px; }.entry { grid-template-columns:82px minmax(0,1fr) 22px; gap:5px; }.entry.no-key { grid-template-columns:minmax(0,1fr) 22px; }.entry-value { font-size:12px; }.dialog-body { padding:18px; } }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark"><i data-lucide="infinity" size="30"></i></span><div><h1>个人面板</h1><small>PERSONAL ARCHIVE</small></div></div>
      <div class="actions">
        <button class="tool tool-label" id="installApp" title="安装应用"><i data-lucide="app-window" size="16"></i><span>安装应用</span></button>
        <button class="tool tool-label" id="exportImage" title="存为图片"><i data-lucide="download" size="16"></i><span>存为图片</span></button>
        <button class="tool" id="exportData" title="导出数据" aria-label="导出数据"><i data-lucide="file-down" size="16"></i></button>
        <button class="tool" id="importData" title="导入数据" aria-label="导入数据"><i data-lucide="file-up" size="16"></i></button>
        <input id="dataFile" type="file" accept="application/json,.json" hidden>
        <button class="tool" id="collapseAll" title="收起全部" aria-label="收起全部"><i data-lucide="fold-vertical" size="16"></i></button>
        <button class="tool" id="reset" title="恢复默认数据" aria-label="恢复默认数据"><i data-lucide="rotate-ccw" size="16"></i></button>
      </div>
    </header>
    <div class="workspace">
      <section class="portrait-column" id="portraitPanel">
        <div class="portrait-zone" id="portraitZone" title="拖入图片或点击上传"><img class="portrait" id="portrait" alt="人物图像" src=""><div class="portrait-hint"><i data-lucide="image-up"></i><span>拖入人物图像<br>或点击上传</span></div><button class="portrait-edit" id="changePortrait" title="上传人物图像"><i data-lucide="image-up" size="16"></i></button><input id="portraitFile" type="file" accept="image/*" hidden></div>
        <i class="resize-handle" data-edge="n"></i><i class="resize-handle" data-edge="e"></i><i class="resize-handle" data-edge="s"></i><i class="resize-handle" data-edge="w"></i><i class="resize-handle" data-edge="ne"></i><i class="resize-handle" data-edge="nw"></i><i class="resize-handle" data-edge="se"></i><i class="resize-handle" data-edge="sw"></i>
      </section>
      <section class="archive"><div class="archive-head"><button class="add-category" id="addCategory"><i data-lucide="plus" size="15"></i>新增分类</button></div><div class="categories" id="categories"></div></section>
    </div>
  </main>
  <dialog id="categoryDialog"><form method="dialog" class="dialog-body"><h2>新增属性分类</h2><label for="categoryName">分类名称</label><input id="categoryName" placeholder="例如：关系、契约、声望" required><div class="dialog-actions"><button class="text-btn" value="cancel">取消</button><button class="text-btn primary" id="confirmCategory" value="default">创建</button></div></form></dialog>
  <script>
    const defaults={templateVersion:4,profile:{portrait:''},categories:[{title:'基本资料',icon:'user-round',items:[['姓名',''],['性别',''],['种族',''],['身份',''],['量级/修为','']]},{title:'绝对特性',icon:'shield-check',items:[]},{title:'能力',icon:'wand-sparkles',items:[]},{title:'喜好',icon:'heart',items:[]},{title:'成就',icon:'trophy',items:[]},{title:'物品',icon:'package',items:[]}]};
    const saved=JSON.parse(localStorage.getItem('status-panel-data')||'null');
    const state=(saved&&Array.isArray(saved.categories))?{templateVersion:4,profile:{portrait:saved.profile?.portrait||''},categories:saved.categories}:structuredClone(defaults);
    const save=()=>localStorage.setItem('status-panel-data',JSON.stringify(state));
    const esc=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
    const categoryIcons=['circle-dot','bookmark','gem','landmark','flame','layers'];
    const portrait=document.querySelector('#portrait'),portraitZone=document.querySelector('#portraitZone'),portraitFile=document.querySelector('#portraitFile');
    function renderPortrait(){portrait.src=state.profile.portrait||'';portraitZone.classList.toggle('has-image',Boolean(state.profile.portrait));}
    function renderCategories(){const root=document.querySelector('#categories');root.innerHTML=state.categories.map((cat,ci)=>`<article class="category" data-category="${ci}"><header class="category-top"><div class="category-title"><i data-lucide="${cat.icon||'circle-dot'}"></i><span class="editable category-name" contenteditable="true">${esc(cat.title)}</span></div><div class="category-controls"><button class="mini move" title="上移"><i data-lucide="arrow-up" size="15"></i></button><button class="mini delete delete-category" title="删除分类"><i data-lucide="trash-2" size="15"></i></button></div></header><div class="entries">${cat.items.map((item,ii)=>`<div class="entry ${item[0]?'':'no-key'}" data-item="${ii}">${item[0]?`<div class="entry-key-wrap"><span class="entry-key editable" contenteditable="true">${esc(item[0])}</span><button class="clear-key" title="删除条目名称"><i data-lucide="x" size="13"></i></button></div>`:''}<span class="entry-value editable" contenteditable="true" data-placeholder="填写内容">${esc(item[1])}</span><button class="entry-remove" title="删除整条记录"><i data-lucide="trash-2" size="14"></i></button></div>`).join('')}<button class="add-entry"><i data-lucide="plus" size="14"></i>添加条目</button></div></article>`).join('');lucide.createIcons();}
    document.querySelector('#categories').addEventListener('focusout',event=>{const cat=event.target.closest('.category'),item=event.target.closest('.entry');if(!cat)return;const ci=+cat.dataset.category;if(event.target.classList.contains('category-name'))state.categories[ci].title=event.target.textContent.trim()||'未命名分类';if(item){const ii=+item.dataset.item;if(event.target.classList.contains('entry-key'))state.categories[ci].items[ii][0]=event.target.textContent.trim()||'字段';if(event.target.classList.contains('entry-value'))state.categories[ci].items[ii][1]=event.target.textContent.trim();}save();});
    document.querySelector('#categories').addEventListener('click',event=>{const cat=event.target.closest('.category');if(!cat)return;const ci=+cat.dataset.category,entry=event.target.closest('.entry');if(event.target.closest('.add-entry')){state.categories[ci].items.push(['新条目','填写内容']);save();renderCategories();}if(event.target.closest('.clear-key')){state.categories[ci].items[+entry.dataset.item][0]='';save();renderCategories();}if(event.target.closest('.entry-remove')){state.categories[ci].items.splice(+entry.dataset.item,1);save();renderCategories();}if(event.target.closest('.delete-category')){state.categories.splice(ci,1);save();renderCategories();}if(event.target.closest('.move')&&ci>0){[state.categories[ci-1],state.categories[ci]]=[state.categories[ci],state.categories[ci-1]];save();renderCategories();}});
    document.querySelector('#addCategory').onclick=()=>{document.querySelector('#categoryName').value='';document.querySelector('#categoryDialog').showModal();};document.querySelector('#confirmCategory').onclick=event=>{const name=document.querySelector('#categoryName').value.trim();if(!name){event.preventDefault();return;}state.categories.push({title:name,icon:categoryIcons[state.categories.length%categoryIcons.length],items:[]});save();renderCategories();};
    function setPortrait(file){if(!file||!file.type.startsWith('image/'))return;const reader=new FileReader();reader.onload=()=>{state.profile.portrait=reader.result;save();renderPortrait();};reader.readAsDataURL(file);}document.querySelector('#changePortrait').onclick=event=>{event.stopPropagation();portraitFile.click();};portraitZone.onclick=event=>{if(!event.target.closest('button'))portraitFile.click();};portraitFile.onchange=event=>setPortrait(event.target.files[0]);['dragenter','dragover'].forEach(type=>portraitZone.addEventListener(type,event=>{event.preventDefault();portraitZone.classList.add('dragging');}));['dragleave','drop'].forEach(type=>portraitZone.addEventListener(type,event=>{event.preventDefault();portraitZone.classList.remove('dragging');}));portraitZone.addEventListener('drop',event=>setPortrait(event.dataTransfer.files[0]));
    const portraitPanel=document.querySelector('#portraitPanel');portraitPanel.addEventListener('pointerdown',event=>{const handle=event.target.closest('.resize-handle');if(!handle)return;event.preventDefault();const edge=handle.dataset.edge,startX=event.clientX,startY=event.clientY,startW=portraitPanel.offsetWidth,startH=portraitPanel.offsetHeight;const resize=move=>{let width=startW,height=startH;if(edge.includes('e'))width=startW+move.clientX-startX;if(edge.includes('w'))width=startW-move.clientX+startX;if(edge.includes('s'))height=startH+move.clientY-startY;if(edge.includes('n'))height=startH-move.clientY+startY;portraitPanel.style.width=Math.max(276,Math.min(window.innerWidth*.52,width))+'px';portraitPanel.style.height=Math.max(300,height)+'px';};const stop=()=>{window.removeEventListener('pointermove',resize);window.removeEventListener('pointerup',stop);};window.addEventListener('pointermove',resize);window.addEventListener('pointerup',stop);});
    document.querySelector('#collapseAll').onclick=()=>{const collapse=[...document.querySelectorAll('.category')].some(card=>!card.classList.contains('compact'));document.querySelectorAll('.category').forEach(card=>card.classList.toggle('compact',collapse));};document.querySelector('#reset').onclick=()=>{if(confirm('确定恢复空白模板？当前编辑内容将被清除。')){Object.assign(state,structuredClone(defaults));save();renderPortrait();renderCategories();}};
    document.querySelector('#exportImage').onclick=async()=>{const button=document.querySelector('#exportImage');button.disabled=true;document.body.classList.add('exporting');try{const canvas=await html2canvas(document.querySelector('.app'),{backgroundColor:'#100e15',scale:2,useCORS:true,logging:false});const link=document.createElement('a');link.download='个人面板.png';link.href=canvas.toDataURL('image/png');link.click();}finally{document.body.classList.remove('exporting');button.disabled=false;}};
    document.querySelector('#exportData').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='个人面板数据.json';link.click();URL.revokeObjectURL(url);};const dataFile=document.querySelector('#dataFile');document.querySelector('#importData').onclick=()=>{dataFile.value='';dataFile.click();};dataFile.onchange=async()=>{try{const imported=JSON.parse(await dataFile.files[0].text());if(!imported?.profile||!Array.isArray(imported.categories))throw Error();if(!confirm('导入会覆盖当前数据，是否继续？'))return;state.profile={portrait:imported.profile.portrait||''};state.categories=imported.categories.filter(cat=>cat&&typeof cat.title==='string'&&Array.isArray(cat.items)).map(cat=>({title:cat.title,icon:cat.icon||'circle-dot',items:cat.items.filter(Array.isArray).map(item=>[String(item[0]||''),String(item[1]||'')])}));save();renderPortrait();renderCategories();}catch{alert('无法导入该文件，请选择由个人面板导出的 JSON 文件。');}};
    const installApp=document.querySelector('#installApp');let deferredPrompt;window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredPrompt=event;});installApp.onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null;return;}alert(/iPad|iPhone|iPod/.test(navigator.userAgent)?'请通过浏览器分享菜单选择“添加到主屏幕”。':'请用 Chrome 或 Edge 打开已发布的网站，刷新页面后再点击安装。');};if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
    renderPortrait();renderCategories();lucide.createIcons();
  </script>
</body>
</html>
